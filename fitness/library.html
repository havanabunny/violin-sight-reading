<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<title>Exercise Library · Fitness · Playground</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--green:#58cc02;--green-dark:#58a700;--blue:#1cb0f6;--blue-dark:#1899d6;
    --ink:#2a231b;--gray:#8a7d6b;--line:#e9e1d3;--bg:#faf7f1;--red:#ff5b5b;}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  main{max-width:560px;margin:0 auto;box-sizing:border-box;padding:8px 20px 48px;}
  .back{display:inline-block;margin-top:10px;color:var(--blue-dark);font-weight:900;text-decoration:none;font-size:15px;}
  h1{font-size:26px;font-weight:900;margin:14px 0 4px;}
  .sub{color:var(--gray);font-weight:700;font-size:14px;margin:0 0 14px;}
  #search{width:100%;box-sizing:border-box;font:inherit;font-weight:700;font-size:15px;
    border:2px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:10px;background:#fff;color:var(--ink);}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .chip{font:inherit;font-weight:800;font-size:13px;border:2px solid var(--line);background:#fff;
    border-radius:999px;padding:7px 13px;cursor:pointer;color:var(--gray);}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff;}
  .ex{background:#fff;border:2px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden;}
  .ex>button{width:100%;background:none;border:none;font:inherit;text-align:left;padding:14px 16px;
    display:flex;align-items:center;gap:12px;cursor:pointer;}
  .ex .t{flex:1}.ex .t b{display:block;font-size:16px;font-weight:900;}
  .ex .t span{font-size:12px;font-weight:700;color:var(--gray);}
  .lvl{font-size:11px;font-weight:900;padding:4px 9px;border-radius:999px;flex:none;}
  .lvl.l1{background:#e6f9d5;color:var(--green-dark);}
  .lvl.l2{background:#fff3d6;color:#b57e00;}
  .lvl.l3{background:#ffe3e3;color:#c0392b;}
  .ex .chev{font-size:20px;color:#afafaf;font-weight:900;}
  .ex .body{display:none;padding:0 16px 16px;font-size:14px;}
  .ex.open .body{display:block;}
  .ex.open .chev{transform:rotate(90deg);}
  .ex h4{margin:10px 0 6px;font-size:13px;font-weight:900;color:var(--green-dark);text-transform:uppercase;letter-spacing:.4px;}
  .ex ul{margin:0;padding-left:20px;font-weight:700;color:#4a4238;line-height:1.6;}
  .ex .bad h4{color:#c0392b;}
  #count{font-size:13px;font-weight:800;color:var(--gray);margin:8px 0 0;}
  #empty{display:none;text-align:center;color:var(--gray);font-weight:800;padding:30px 0;}
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">‹ Fitness</a>
  <h1>📚 Exercise Library</h1>
  <p class="sub">Tap any exercise for form cues and common mistakes.</p>
  <input id="search" type="search" placeholder="Search exercises…">
  <div class="filters" id="catf"></div>
  <div class="filters" id="lvlf"></div>
  <p id="count"></p>
  <div id="list"></div>
  <div id="empty">No exercises match. Try clearing a filter.</div>
</main>
<script src="data.js"></script>
<script>
var cat='all',lvl='all',q='';
var catf=document.getElementById('catf'),lvlf=document.getElementById('lvlf');
function chip(label,on,cb){
  var b=document.createElement('button');b.className='chip'+(on?' on':'');b.textContent=label;
  b.onclick=function(){cb();};return b;
}
function renderFilters(){
  catf.innerHTML='';lvlf.innerHTML='';
  catf.appendChild(chip('All',cat==='all',function(){cat='all';draw();}));
  Object.keys(CATS).forEach(function(k){
    catf.appendChild(chip(CATS[k],cat===k,function(){cat=k;draw();}));
  });
  lvlf.appendChild(chip('Any level',lvl==='all',function(){lvl='all';draw();}));
  [1,2,3].forEach(function(n){
    lvlf.appendChild(chip(LEVELS[n],lvl===n,function(){lvl=n;draw();}));
  });
}
function draw(){
  renderFilters();
  var list=document.getElementById('list');list.innerHTML='';
  var shown=0;
  EXERCISES.forEach(function(e){
    if(cat!=='all'&&e.cat!==cat)return;
    if(lvl!=='all'&&e.level!==lvl)return;
    if(q&&!(e.name+' '+e.muscles).toLowerCase().includes(q))return;
    shown++;
    var d=document.createElement('div');d.className='ex';
    d.innerHTML='<button><span class="t"><b>'+e.name+'</b><span>'+CATS[e.cat]+' · '+e.muscles+'</span></span>'+
      '<span class="lvl l'+e.level+'">'+LEVELS[e.level]+'</span><span class="chev">›</span></button>'+
      '<div class="body"><h4>✅ Do it like this</h4><ul>'+
      e.cues.map(function(c){return '<li>'+c+'</li>';}).join('')+'</ul>'+
      '<div class="bad"><h4>🚫 Watch out for</h4><ul>'+
      e.mistakes.map(function(m){return '<li>'+m+'</li>';}).join('')+'</ul></div></div>';
    d.querySelector('button').onclick=function(){d.classList.toggle('open');};
    list.appendChild(d);
  });
  document.getElementById('count').textContent=shown+' exercise'+(shown===1?'':'s');
  document.getElementById('empty').style.display=shown?'none':'block';
}
document.getElementById('search').addEventListener('input',function(e){
  q=e.target.value.trim().toLowerCase();draw();
});
draw();
</script>
</body>
</html>
