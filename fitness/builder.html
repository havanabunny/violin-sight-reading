<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#58cc02">
<title>Program Builder · Fitness · Playground</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗓️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{--green:#58cc02;--green-dark:#58a700;--blue:#1cb0f6;--blue-dark:#1899d6;
    --ink:#2a231b;--gray:#8a7d6b;--line:#e9e1d3;--bg:#faf7f1;--red:#ff5b5b;}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  main{max-width:560px;margin:0 auto;box-sizing:border-box;padding:8px 20px 48px;}
  .back{display:inline-block;margin-top:10px;color:var(--blue-dark);font-weight:900;text-decoration:none;font-size:15px;}
  h1{font-size:26px;font-weight:900;margin:14px 0 4px;}
  .sub{color:var(--gray);font-weight:700;font-size:14px;margin:0 0 14px;}
  h2{font-size:19px;font-weight:900;margin:24px 0 10px;}
  .card{background:#fff;border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px;}
  .row{display:flex;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
  .field{flex:1;min-width:120px;display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:12px;font-weight:900;color:var(--gray);text-transform:uppercase;letter-spacing:.4px;}
  .field input,.field select{font:inherit;font-weight:700;font-size:15px;border:2px solid var(--line);
    border-radius:12px;padding:10px 12px;background:#fff;color:var(--ink);width:100%;box-sizing:border-box;}
  .tabs{display:flex;gap:8px;margin-bottom:12px;}
  .tab{flex:1;font:inherit;font-weight:900;font-size:15px;border:2px solid var(--line);background:#fff;
    border-radius:14px;padding:12px;cursor:pointer;color:var(--gray);}
  .tab.on{background:var(--blue);border-color:var(--blue);color:#fff;}
  .daytabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .dtab{font:inherit;font-weight:800;font-size:14px;border:2px solid var(--line);background:#fff;
    border-radius:999px;padding:8px 16px;cursor:pointer;color:var(--gray);}
  .dtab.on{background:var(--green);border-color:var(--green);color:#fff;}
  .exrow{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid var(--line);
    border-radius:12px;padding:10px 12px;margin-bottom:8px;}
  .exrow .nm{flex:1;font-weight:800;font-size:14px;}
  .exrow .nm span{display:block;font-size:12px;color:var(--gray);font-weight:700;}
  .exrow .del{background:none;border:none;font-size:18px;cursor:pointer;color:var(--red);font-weight:900;}
  .btn{display:block;width:100%;font:inherit;font-weight:900;font-size:16px;color:#fff;background:var(--green);
    border:none;border-radius:14px;padding:13px;box-shadow:0 4px 0 var(--green-dark);cursor:pointer;}
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-dark);}
  .btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue-dark);}
  .btn.blue:active{box-shadow:0 1px 0 var(--blue-dark);}
  .hint{background:#eef9ff;border:2px dashed var(--blue);border-radius:14px;padding:12px 14px;
    font-size:13px;font-weight:700;color:#4a6a80;margin-bottom:12px;line-height:1.55;}
  .hint b{color:var(--blue-dark);}
  .planview .day{margin-bottom:16px;}
  .planview .day h3{font-size:16px;font-weight:900;margin:0 0 8px;color:var(--blue-dark);}
  .planview li{font-weight:700;font-size:14px;margin-bottom:6px;line-height:1.5;}
  .planview ul{padding-left:20px;margin:0;}
  .empty{color:var(--gray);font-weight:700;font-size:14px;text-align:center;padding:16px 0;}
</style>
</head>
<body>
<main>
  <a class="back" href="index.html">‹ Fitness</a>
  <h1>🗓️ Program Builder</h1>
  <p class="sub">Two profiles, one plan each. Everything saves on this device.</p>

  <h2>1 · Who's training?</h2>
  <div class="card" id="p0card">
    <div class="row">
      <div class="field"><label>Name</label><input id="p0name" value="Chengcheng"></div>
      <div class="field"><label>Level</label><select id="p0level">
        <option value="1">Beginner</option><option value="2" selected>Intermediate</option><option value="3">Advanced</option></select></div>
    </div>
    <div class="row">
      <div class="field"><label>Days / week</label><select id="p0days">
        <option>2</option><option selected>3</option><option>4</option></select></div>
      <div class="field"><label>Goal</label><select id="p0goal">
        <option value="general">General fitness</option><option value="muscle">Build muscle</option><option value="fatloss">Fat loss</option></select></div>
    </div>
  </div>
  <div class="card" id="p1card">
    <div class="row">
      <div class="field"><label>Name</label><input id="p1name" value="Ye Han"></div>
      <div class="field"><label>Level</label><select id="p1level">
        <option value="1" selected>Beginner</option><option value="2">Intermediate</option><option value="3">Advanced</option></select></div>
    </div>
    <div class="row">
      <div class="field"><label>Days / week</label><select id="p1days">
        <option selected>2</option><option>3</option><option>4</option></select></div>
      <div class="field"><label>Goal</label><select id="p1goal">
        <option value="general" selected>General fitness</option><option value="muscle">Build muscle</option><option value="fatloss">Fat loss</option></select></div>
    </div>
  </div>

  <h2>2 · Build the workouts</h2>
  <div class="tabs">
    <button class="tab on" id="tab0">Chengcheng</button>
    <button class="tab" id="tab1">Ye Han</button>
  </div>
  <div class="hint" id="splitHint"></div>
  <div class="daytabs" id="daytabs"></div>
  <div id="daylist"></div>
  <div class="card">
    <div class="row">
      <div class="field" style="flex:2;min-width:180px"><label>Exercise</label><select id="pick"></select></div>
    </div>
    <div class="row">
      <div class="field"><label>Sets</label><select id="sets"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select></div>
      <div class="field"><label>Reps</label><select id="reps"><option>5</option><option>8</option><option>10</option><option selected>12</option><option>15</option><option>20</option></select></div>
    </div>
    <button class="btn" id="add">+ Add to this day</button>
  </div>

  <h2>3 · The plan</h2>
  <div class="card planview" id="planview"></div>
  <button class="btn blue" id="print">🖨️ Print / save as PDF</button>
</main>
<script src="data.js"></script>
<script>
var S={profiles:[
  {name:"Chengcheng",level:2,days:3,goal:"general",plan:{}},
  {name:"Ye Han",level:1,days:2,goal:"general",plan:{}}
]};
try{var saved=JSON.parse(localStorage.getItem('fit-plan'));if(saved&&saved.profiles)S=saved;}catch(e){}
var cur=0,curDay=1;
function save(){try{localStorage.setItem('fit-plan',JSON.stringify(S));}catch(e){}}
function syncInputs(){
  for(var i=0;i<2;i++){
    document.getElementById('p'+i+'name').value=S.profiles[i].name;
    document.getElementById('p'+i+'level').value=S.profiles[i].level;
    document.getElementById('p'+i+'days').value=S.profiles[i].days;
    document.getElementById('p'+i+'goal').value=S.profiles[i].goal;
  }
  document.getElementById('tab0').textContent=S.profiles[0].name;
  document.getElementById('tab1').textContent=S.profiles[1].name;
}
for(var i=0;i<2;i++)(function(i){
  ['name','level','days','goal'].forEach(function(f){
    document.getElementById('p'+i+f).addEventListener('change',function(e){
      var v=e.target.value;
      if(f==='level')v=parseInt(v,10);
      if(f==='days')v=parseInt(v,10);
      S.profiles[i][f]=v;
      if(f==='days'&&cur===i&&curDay>v)curDay=v;
      save();syncInputs();drawDays();drawPlan();
    });
  });
})(i);
document.getElementById('tab0').onclick=function(){cur=0;curDay=1;drawTabs();drawDays();drawPlan();};
document.getElementById('tab1').onclick=function(){cur=1;curDay=1;drawTabs();drawDays();drawPlan();};
function drawTabs(){
  document.getElementById('tab0').classList.toggle('on',cur===0);
  document.getElementById('tab1').classList.toggle('on',cur===1);
}
var SPLITS={2:"<b>2 days:</b> full-body A / full-body B. Hit every muscle twice a week — ideal for beginners.",
 3:"<b>3 days:</b> full-body each day (rotate exercise variations), or push / pull / legs. Full-body is simplest.",
 4:"<b>4 days:</b> upper / lower split, twice each. More volume per muscle without marathon sessions."};
function drawDays(){
  var p=S.profiles[cur],dt=document.getElementById('daytabs');dt.innerHTML='';
  document.getElementById('splitHint').innerHTML=SPLITS[p.days]||'';
  for(var d=1;d<=p.days;d++)(function(d){
    var b=document.createElement('button');b.className='dtab'+(d===curDay?' on':'');
    b.textContent='Day '+d;
    b.onclick=function(){curDay=d;drawDays();};
    dt.appendChild(b);
  })(d);
  var list=document.getElementById('daylist');list.innerHTML='';
  var items=(p.plan[curDay]||[]);
  if(!items.length){list.innerHTML='<div class="empty">No exercises yet — add the first one below.</div>';return;}
  items.forEach(function(it,idx){
    var e=EXERCISES.find(function(x){return x.id===it.id;});
    var row=document.createElement('div');row.className='exrow';
    row.innerHTML='<div class="nm">'+(e?e.name:it.id)+'<span>'+it.sets+' × '+it.reps+'</span></div>'+
      '<button class="del" aria-label="remove">×</button>';
    row.querySelector('.del').onclick=function(){
      p.plan[curDay].splice(idx,1);save();drawDays();drawPlan();
    };
    list.appendChild(row);
  });
}
function fillPicker(){
  var sel=document.getElementById('pick');sel.innerHTML='';
  var p=S.profiles[cur];
  Object.keys(CATS).forEach(function(c){
    var g=document.createElement('optgroup');g.label=CATS[c];
    EXERCISES.filter(function(e){return e.cat===c&&e.level<=p.level;}).forEach(function(e){
      var o=document.createElement('option');o.value=e.id;
      o.textContent=e.name+' ('+LEVELS[e.level]+')';g.appendChild(o);
    });
    if(g.children.length)sel.appendChild(g);
  });
}
document.getElementById('add').onclick=function(){
  var p=S.profiles[cur],id=document.getElementById('pick').value;
  if(!id)return;
  if(!p.plan[curDay])p.plan[curDay]=[];
  p.plan[curDay].push({id:id,
    sets:document.getElementById('sets').value,
    reps:document.getElementById('reps').value});
  save();drawDays();drawPlan();
};
var GOALPHASE={general:"Phases 1 → 2",muscle:"Phase 1, then 2 → 3 → 4",fatloss:"Phases 1 → 2 → 3"};
function drawPlan(){
  var v=document.getElementById('planview');v.innerHTML='';
  S.profiles.forEach(function(p,pi){
    var h=document.createElement('div');h.className='day';
    h.innerHTML='<h3>'+p.name+' — '+p.days+' days/wk · '+LEVELS[p.level]+' · OPT '+GOALPHASE[p.goal]+'</h3>';
    var ul=document.createElement('ul'),any=false;
    for(var d=1;d<=p.days;d++){
      var items=p.plan[d]||[];
      if(items.length){any=true;
        var li=document.createElement('li');
        li.innerHTML='<b>Day '+d+':</b> '+items.map(function(it){
          var e=EXERCISES.find(function(x){return x.id===it.id;});
          return (e?e.name:it.id)+' '+it.sets+'×'+it.reps;
        }).join(' · ');
        ul.appendChild(li);
      }
    }
    if(!any){var li=document.createElement('li');li.textContent='No workouts built yet.';ul.appendChild(li);}
    h.appendChild(ul);v.appendChild(h);
  });
  fillPicker();
}
document.getElementById('print').onclick=function(){window.print();};
syncInputs();drawTabs();drawDays();drawPlan();
</script>
</body>
</html>
